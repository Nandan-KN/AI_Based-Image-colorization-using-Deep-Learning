<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorization Result - DDColor</title>

    <style>

        /* ======================================================
           RESET & BASE
        ====================================================== */

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep:       #0a0e1a;
            --bg-card:       rgba(15, 20, 40, 0.85);
            --accent-blue:   #4f8ef7;
            --accent-purple: #a855f7;
            --accent-cyan:   #22d3ee;
            --accent-green:  #22c55e;
            --text-primary:  #f1f5f9;
            --text-muted:    #94a3b8;
            --border:        rgba(255,255,255,0.10);
            --glow-blue:     0 0 40px rgba(79,142,247,0.35);
            --glow-purple:   0 0 40px rgba(168,85,247,0.30);
            --radius-lg:     20px;
            --radius-md:     12px;
            --radius-sm:     8px;
            --transition:    0.3s cubic-bezier(.4,0,.2,1);
        }

        html { scroll-behavior: smooth; }

        body {
            min-height: 100vh;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
        }

        /* ======================================================
           ANIMATED BACKGROUND
        ====================================================== */

        .bg-orbs {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.18;
            animation: drift 18s ease-in-out infinite alternate;
        }

        .orb-1 {
            width: 520px; height: 520px;
            background: radial-gradient(circle, #4f8ef7, transparent);
            top: -120px; left: -100px;
            animation-duration: 20s;
        }

        .orb-2 {
            width: 420px; height: 420px;
            background: radial-gradient(circle, #a855f7, transparent);
            top: 30%; right: -120px;
            animation-duration: 25s;
            animation-delay: -8s;
        }

        .orb-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, #22d3ee, transparent);
            bottom: -80px; left: 40%;
            animation-duration: 22s;
            animation-delay: -14s;
        }

        @keyframes drift {
            0%   { transform: translate(0,   0)   scale(1); }
            50%  { transform: translate(40px,60px) scale(1.08); }
            100% { transform: translate(-30px,20px) scale(0.95); }
        }

        /* ======================================================
           LAYOUT
        ====================================================== */

        .page {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 48px 20px 60px;
            gap: 36px;
        }

        /* ======================================================
           HEADER
        ====================================================== */

        .header {
            text-align: center;
            max-width: 680px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(34,211,238,0.15);
            border: 1px solid rgba(34,211,238,0.35);
            border-radius: 999px;
            padding: 5px 16px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--accent-cyan);
            margin-bottom: 22px;
        }

        .badge-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent-cyan);
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%       { opacity: 0.4; transform: scale(0.7); }
        }

        h1 {
            font-size: clamp(28px, 5vw, 48px);
            font-weight: 800;
            line-height: 1.15;
            background: linear-gradient(135deg, #f1f5f9 30%, var(--accent-cyan) 70%, var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 14px;
        }

        .subtitle {
            font-size: 16px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ======================================================
           MAIN CARD
        ====================================================== */

        .card {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: 0 24px 80px rgba(0,0,0,0.55), var(--glow-blue);
        }

        /* ======================================================
           RESULT SECTION
        ====================================================== */

        .result-section {
            margin-top: 20px;
        }

        .section-label {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Side-by-side comparison */

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 768px) {
            .compare-grid { grid-template-columns: 1fr; }
        }

        .img-panel {
            position: relative;
            border-radius: var(--radius-md);
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            aspect-ratio: 4/3;
        }

        .img-panel img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .img-panel-label {
            position: absolute;
            top: 12px; left: 12px;
            background: rgba(10,14,26,0.85);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .07em;
            text-transform: uppercase;
            backdrop-filter: blur(8px);
        }

        .img-panel-label.original { color: var(--text-muted); }
        .img-panel-label.colorized {
            color: var(--accent-cyan);
            border-color: rgba(34,211,238,0.35);
            background: rgba(34,211,238,0.10);
        }

        /* ======================================================
           ACTION BUTTONS ROW
        ====================================================== */

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: var(--transition);
            border: 1px solid transparent;
        }

        .btn-download {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: white;
            box-shadow: 0 4px 16px rgba(34,197,94,0.3);
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(34,197,94,0.45);
        }

        .btn-again {
            background: rgba(255,255,255,0.06);
            border-color: var(--border);
            color: var(--text-primary);
        }

        .btn-again:hover {
            background: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }

        /* ======================================================
           INFO STRIP
        ====================================================== */

        .info-strip {
            display: flex;
            justify-content: center;
            gap: 28px;
            flex-wrap: wrap;
            padding: 18px 0 0;
            border-top: 1px solid var(--border);
            margin-top: 36px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .info-item strong { color: var(--text-primary); }

        .info-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--accent-cyan);
        }

    </style>
</head>


<body>

    <!-- Ambient background orbs -->
    <div class="bg-orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="page">

        <!-- ── HEADER ── -->
        <header class="header">

            <div class="badge">
                <span class="badge-dot"></span>
                Result · DDColor
            </div>

            <h1>Colorization Complete</h1>

            <p class="subtitle">
                Your image has been successfully colorized using DDColor's state-of-the-art transformer architecture.
            </p>

        </header>


        <!-- ── MAIN CARD ── -->
        <main class="card">

            <div class="result-section">

                <p class="section-label">Comparison</p>

                <div class="compare-grid">

                    <!-- Original Image -->
                    <div class="img-panel">
                        <img
                            src="{{ url_for('uploaded_file', filename=input_image) }}"
                            alt="Input Image"
                        >
                        <span class="img-panel-label original">Original</span>
                    </div>

                    <!-- Colorized Image -->
                    <div class="img-panel">
                        <img
                            src="{{ url_for('result_file', filename=output_image) }}"
                            alt="Colorized Image"
                        >
                        <span class="img-panel-label colorized">✦ Colorized</span>
                    </div>

                </div>

                <div class="actions">

                    <a
                        class="btn btn-download"
                        href="{{ url_for('result_file', filename=output_image) }}"
                        download="ddcolor_colorized.jpg"
                    >
                        ⬇ &nbsp; Download
                    </a>

                    <a
                        class="btn btn-again"
                        href="/"
                    >
                        ↺ &nbsp; Colorize Another
                    </a>

                </div>

            </div>


            <!-- ── INFO STRIP ── -->
            <div class="info-strip">

                <div class="info-item">
                    <span class="info-dot"></span>
                    <span><strong>Model</strong> &nbsp; DDColor</span>
                </div>

                <div class="info-item">
                    <span class="info-dot"></span>
                    <span><strong>Architecture</strong> &nbsp; Transformer</span>
                </div>

                <div class="info-item">
                    <span class="info-dot"></span>
                    <span><strong>Quality</strong> &nbsp; Photorealistic</span>
                </div>

                <div class="info-item">
                    <a href="http://127.0.0.1:5004" style="color: var(--accent-cyan); text-decoration: none; font-weight: 600;">
                        ← Back to Hub
                    </a>
                </div>

            </div>

        </main>

    </div>

</body>
</html>
